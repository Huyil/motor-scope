# LKS32MC07x (Linko, Cortex-M0) — MotorScope 只读采样目标
#
# 只做 SWD 连核 + 内存读，不配置 Flash bank：本工具的采样默认只读，
# 不 halt / 不 reset / 不烧录。烧录请用 Keil + Linko DFP 或厂商工具。
#
# 用法（与 cw32l01x-flm.cfg 同级替换）：
#   openocd -f interface/cmsis-dap.cfg -f <此文件> -c "tcl_port 6666"
#
# 说明：
#   * LKS32MC07x 的 Flash 在 0x0000_0000，RAM 0x2000_0000 起 12KB；
#   * 调试口是标准 ARM SWD（PA13=SWDIO / PA14=SWCLK），不是 WCH 的单线 SDI；
#   * reset_config none：采样期间不碰复位脚；需要复位时由用户手动操作。

adapter speed 8000
transport select swd

set CHIPNAME lks32mc07x
source [find target/swj-dp.tcl]
swj_newdap $CHIPNAME cpu -irlen 4
dap create $CHIPNAME.dap -chain-position $CHIPNAME.cpu
target create $CHIPNAME.cpu cortex_m -dap $CHIPNAME.dap
$CHIPNAME.cpu configure -work-area-phys 0x20000000 -work-area-size 0x1000 -work-area-backup 0

reset_config none
